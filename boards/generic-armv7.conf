# Generic 32-bit ARM (ARMv7-A)
# ARMv7 cores have no AES engine, so auto resolves to ChaCha20-Poly1305.
# Copy this file and pin WORKERS/MIKRODOH_TUNE once you know the SoC.

LISTEN_PORT=53
DOH_URL=https://1.1.1.1/dns-query

CIPHER=auto

# Unset lets the daemon use the core count reported by the OS.
# WORKERS=2

MAX_INFLIGHT=256
RCVBUF_KB=2048
CHECK_CERT=true
TCP_KEEP_ALIVE=30
CACHE=60

MIKRODOH_TUNE="-march=armv7-a"

# Image variant. MIKRODOH_PLATFORM is the target this board builds for.
# MIKRODOH_VARIANT names a tuned image, published as
# c127/mikrodoh:v<version>-<variant> on stable releases; leave it empty when
# the stock multi-architecture image already covers the board.
MIKRODOH_PLATFORM="linux/arm/v7"
MIKRODOH_VARIANT=""
