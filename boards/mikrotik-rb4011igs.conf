# MikroTik RB4011iGS+
# SoC   : Annapurna Labs AL21400, 4x Cortex-A15 @ 1.4 GHz
# ISA   : ARMv7-A, NEON + VFPv4, no ARMv8 crypto extensions
# Host  : RouterOS v7 container
#
# Reference board: every default here is measured on this device.
# Runtime keys are read as environment variables (podman/docker --env-file).

LISTEN_PORT=53
DOH_URL=https://1.1.1.1/dns-query

# No AES engine on Cortex-A15, so AES-GCM records are computed in software and
# cap DoH throughput. auto resolves to ChaCha20-Poly1305 here.
CIPHER=auto

# One event loop per core. Each loop multiplexes hundreds of in-flight queries
# over a single HTTP/2 connection, so this tracks cores, not query volume.
WORKERS=4

MAX_INFLIGHT=512
RCVBUF_KB=4096
CHECK_CERT=false
TCP_KEEP_ALIVE=30
CACHE=60

# Consumed by scripts/build.sh, not by the daemon.
MIKRODOH_TUNE="-mcpu=cortex-a15 -mfpu=neon-vfpv4 -mfloat-abi=hard"

# Image variant. MIKRODOH_PLATFORM is the target this board builds for.
# MIKRODOH_VARIANT names a tuned image, published as
# c127/mikrodoh:v<version>-<variant> on stable releases; leave it empty when
# the stock multi-architecture image already covers the board.
MIKRODOH_PLATFORM="linux/arm/v7"
MIKRODOH_VARIANT="rb4011igs"
