# Generic 64-bit ARM (ARMv8-A)
# Most ARMv8 SoCs ship the crypto extensions, so auto resolves to AES-GCM.
# Cores without them (Cortex-A53 parts with crypto fused off) fall back to
# ChaCha20 on their own, because the choice is made from HWCAP at startup.

LISTEN_PORT=53
DOH_URL=https://1.1.1.1/dns-query

CIPHER=auto

MAX_INFLIGHT=512
RCVBUF_KB=4096
CHECK_CERT=true
TCP_KEEP_ALIVE=30
CACHE=60

MIKRODOH_TUNE="-march=armv8-a"

# Image variant. MIKRODOH_PLATFORM is the target this board builds for.
# MIKRODOH_VARIANT names a tuned image, published as
# c127/mikrodoh:v<version>-<variant> on stable releases; leave it empty when
# the stock multi-architecture image already covers the board.
MIKRODOH_PLATFORM="linux/arm64"
MIKRODOH_VARIANT=""
