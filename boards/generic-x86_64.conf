# Generic x86_64
# AES-NI is present on anything from Westmere onward, so auto resolves to
# AES-GCM. Pre-AES-NI CPUs are detected via CPUID and get ChaCha20 instead.

LISTEN_PORT=53
DOH_URL=https://1.1.1.1/dns-query

CIPHER=auto

MAX_INFLIGHT=2048
RCVBUF_KB=8192
CHECK_CERT=true
TCP_KEEP_ALIVE=30
CACHE=60

MIKRODOH_TUNE=""

# Image variant. MIKRODOH_PLATFORM is the target this board builds for.
# MIKRODOH_VARIANT names a tuned image, published as
# c127/mikrodoh:v<version>-<variant> on stable releases; leave it empty when
# the stock multi-architecture image already covers the board.
MIKRODOH_PLATFORM="linux/amd64"
MIKRODOH_VARIANT=""
