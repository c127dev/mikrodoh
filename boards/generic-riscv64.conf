# Generic 64-bit RISC-V (RV64GC)
# The base ISA has no AES engine, and the crypto extensions that would give it
# one (Zkne scalar, Zvkned vector) are missing from the SBC-class SoCs this
# targets. There is no probe, so auto always resolves to ChaCha20-Poly1305.
#
# Set CIPHER=aes by hand if you are on a core that does have them and
# scripts/crypto-bench.sh says AES-GCM wins.

LISTEN_PORT=53
DOH_URL=https://1.1.1.1/dns-query

CIPHER=auto

MAX_INFLIGHT=256
RCVBUF_KB=2048
CHECK_CERT=true
TCP_KEEP_ALIVE=30
CACHE=60

MIKRODOH_TUNE="-march=rv64gc -mabi=lp64d"

# No variant image: the tune flags here are the RV64GC defaults, so it would
# duplicate the linux/riscv64 half of the stock image.
# Image variant. MIKRODOH_PLATFORM is the target this board builds for.
# MIKRODOH_VARIANT names a tuned image, published as
# c127/mikrodoh:v<version>-<variant> on stable releases; leave it empty when
# the stock multi-architecture image already covers the board.
MIKRODOH_PLATFORM="linux/riscv64"
MIKRODOH_VARIANT=""
